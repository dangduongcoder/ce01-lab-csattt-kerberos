<text xml:space="preserve" text-anchor="middle" x="295.75" y="-510.5" font-family="Arial,Helvetica,sans-serif" font-size="10.00">1. Bất thường chuỗi sự kiện (Sequence Anomaly):</text>
<text xml:space="preserve" text-anchor="middle" x="295.75" y="-498.5" font-family="Arial,Helvetica,sans-serif" font-size="10.00"> &#160;&#160;Xuất hiện yêu cầu TGS&#45;REQ mà trước đó HOÀN TOÀN KHÔNG CÓ yêu cầu AS&#45;REQ tương ứng từ cùng địa chỉ IP.</text>
<text xml:space="preserve" text-anchor="middle" x="295.75" y="-474.5" font-family="Arial,Helvetica,sans-serif" font-size="10.00">2. Bất thường thời hạn hiệu lực vé (Lifetime Anomaly):</text>
<text xml:space="preserve" text-anchor="middle" x="295.75" y="-462.5" font-family="Arial,Helvetica,sans-serif" font-size="10.00"> &#160;&#160;Thời hạn sống của vé giả mạo vượt xa chính sách Kerberos Domain Policy mặc định (10 năm so với chuẩn 10 giờ).</text>
<text xml:space="preserve" text-anchor="middle" x="295.75" y="-438.5" font-family="Arial,Helvetica,sans-serif" font-size="10.00">3. Biện pháp khắc phục triệt để (Remediation Protocol):</text>
<text xml:space="preserve" text-anchor="middle" x="295.75" y="-426.5" font-family="Arial,Helvetica,sans-serif" font-size="10.00"> &#160;&#160;Đổi mật khẩu tài khoản krbtgt HAI LẦN LIÊN TIẾP (Double Reset).</text>
<text xml:space="preserve" text-anchor="middle" x="295.75" y="-414.5" font-family="Arial,Helvetica,sans-serif" font-size="10.00"> &#160;&#160;Lần 1 để vô hiệu hóa khóa cũ, lần 2 để xóa hoàn toàn lịch sử khóa (krbtgt:history) khỏi Active Directory.</text>
</g>
